[package]
name = "ocs_doc_api"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
kernel = ["dep:acadrust", "dep:cadkernel"]
engine = ["kernel"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
acadrust = { workspace = true, optional = true }
cadkernel = { workspace = true, optional = true }

[dev-dependencies]
toml = { workspace = true }

[build-dependencies]
serde-reflection = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
acadrust = { workspace = true, features = ["serde"] }

[[example]]
name = "create_and_read_line"
required-features = ["engine"]

[[example]]
name = "offset_polyline"
required-features = ["engine"]

[[example]]
name = "list_entities"
required-features = ["engine"]

[[example]]
name = "snapshot_document"
required-features = ["engine"]

[[example]]
name = "validate_payload"
required-features = ["engine"]

[[bin]]
name = "generate_docs"
path = "src/bin/generate_docs.rs"
